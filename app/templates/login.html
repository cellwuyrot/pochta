{% extends "base.html" %}{% block title %}Вход — SMTP Service{% endblock %}{% block body %}<main class="login-shell"><div class="login-panel"><p class="eyebrow">SMTP Service / Control</p><h2>Вход в панель</h2><p class="muted">Домены, маршрутизация и история отправки.</p>{% if error %}<div class="notice" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/admin/login"><input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}"><div class="form-group"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="form-group"><label for="password">Пароль</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Войти →</button></form></div></main>{% endblock %}
